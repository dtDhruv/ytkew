[package]
name = "ytkew"
version = "0.1.0"
edition = "2021"
# The floor the dependency tree already imposes -- ratatui and time both
# require it -- not a number picked by hand. Packagers rely on this.
rust-version = "1.88"
description = "A terminal YouTube Music player, in the spirit of kew"
repository = "https://github.com/dtDhruv/ytkew"
readme = "README.md"
keywords = ["music", "youtube", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
# Nobody running `cargo install ytkew` needs the website's Astro sources or
# the CI workflows, and shipping them only makes the crate bigger to fetch.
# The desktop entry, icon and Makefile stay: they are how you get the launcher
# entry that `cargo install` cannot set up on its own.
exclude = [
    "docs/",
    ".github/",
    "deny.toml",
    ".gitignore",
]
license = "GPL-3.0-or-later"

[features]
default = ["browser-cookies"]
# Reads the Firefox cookie store so `ytkew auth browser` can find an existing
# YouTube Music login. Pulls in a bundled SQLite; turn it off for a leaner
# build and use `ytkew --auth cookie` instead.
browser-cookies = ["dep:rusqlite"]

[dependencies]
ytmapi-rs = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
rand = "0.10"
futures = "0.3"
libc = "0.2"
which = "8"
# Already in the tree via ratatui, so this is close to free -- and beats
# hand-rolling calendar arithmetic.
time = { version = "0.3", features = ["local-offset"] }
mpris-server = { version = "0.10", features = ["tokio"] }
base64 = "0.23.1"
png = "0.18.1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# Lint levels live here rather than in CLI flags, so `cargo clippy` locally
# and in CI agree without anyone remembering the arguments. CI runs clippy
# with -D warnings, which turns every one of these into an error there.
[lints.rust]
# unsafe is used deliberately in art/terminal.rs for termios and ioctl. Each
# block should say why, and no new ones should appear unnoticed.
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[lints.clippy]
# A music player has no business panicking. Tests are exempt at the crate
# root, where asserting is the point.
unwrap_used = "warn"
# Same reasoning. A message does not make a panic acceptable in a player.
expect_used = "warn"
# Debugging leftovers.
dbg_macro = "warn"
todo = "warn"
# Silent precision and sign surprises.
cast_possible_truncation = "allow"  # pervasive and deliberate in the renderer
# Correctness traps that are easy to write and hard to spot.
await_holding_lock = "warn"
manual_let_else = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
