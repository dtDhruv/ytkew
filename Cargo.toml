[package]
name = "ytkew"
version = "0.1.0"
edition = "2021"
description = "A terminal YouTube Music player, in the spirit of kew"
repository = "https://github.com/dtDhruv/ytkew"
readme = "README.md"
keywords = ["music", "youtube", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
license = "GPL-3.0-or-later"

[features]
default = ["browser-cookies"]
# Reads the Firefox cookie store so `ytkew auth browser` can find an existing
# YouTube Music login. Pulls in a bundled SQLite; turn it off for a leaner
# build and use `ytkew --auth cookie` instead.
browser-cookies = ["dep:rusqlite"]

[dependencies]
ytmapi-rs = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "fs", "signal"] }
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
rand = "0.10"
futures = "0.3"
libc = "0.2"
mpris-server = { version = "0.10", features = ["tokio"] }
base64 = "0.23.1"
png = "0.18.1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
