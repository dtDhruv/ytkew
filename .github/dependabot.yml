version: 2
updates:
  # ytmapi-rs is the one that matters: YouTube changes its internal API and
  # the fix lands there first.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  # The docs site's build tooling. Grouped, because Astro and Starlight
  # release often and each bump on its own would be noise.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docs:
        patterns: ["*"]
