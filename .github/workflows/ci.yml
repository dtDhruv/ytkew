name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux is where ytkew is developed; macOS is here so "it should work
    # there" stops being a guess. Everything it needs is POSIX, but nothing
    # was proving it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # browser-cookies is on by default and gates a whole module, so the
      # build without it has to stay clean too -- otherwise it rots unnoticed.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test

      - name: Check the derived assets are current
        # The icon lives in assets/ and is copied into the site; the wordmark
        # is generated from the banner. Both are easy to change in one place
        # and forget in the others.
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 .github/scripts/gen_assets.py
          if ! git diff --quiet; then
            echo "::error::Derived assets are stale. Run: python3 .github/scripts/gen_assets.py"
            git diff --stat
            exit 1
          fi
