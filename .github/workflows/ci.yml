name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Linux is where ytkew is developed; macOS is here so "it should work
    # there" stops being a guess. Everything it needs is POSIX, but nothing
    # was proving it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # browser-cookies is on by default and gates a whole module, so the
      # build without it has to stay clean too -- otherwise it rots unnoticed.
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test
