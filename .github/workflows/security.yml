name: security

on:
  push:
    branches: [main]
  pull_request:
  # Advisories get published against code that has not changed, so the useful
  # signal comes from re-running on a schedule rather than only on commits.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on any known vulnerability in the dependency tree.
      - run: cargo audit --deny warnings

  deny:
    name: licences and bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  secrets:
    name: credential hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the history, not just the tip: a credential removed in a
          # later commit is still published.
          fetch-depth: 0
      - run: python3 .github/scripts/check_secrets.py

  dependency-review:
    name: dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, SSPL-1.0, BUSL-1.1
