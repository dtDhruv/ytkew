name: pages

# Builds the Astro Starlight site in docs/ and publishes it to GitHub Pages.
#
# Pages must be set to build from GitHub Actions: Settings -> Pages -> Source
# -> "GitHub Actions". Without it configure-pages fails with a bare 404, so
# the preflight below says so in words.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/check_links.py"
  # So the site can be republished without an unrelated commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part-way: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `ci` rather than `install`: the lockfile decides, so a build here
      # matches the build that was tested.
      - run: npm ci

      - name: Check for known vulnerabilities
        # The site is static, but its build tooling still runs on a runner
        # with a token. Advisories in it are worth knowing about.
        run: npm audit --audit-level=high

      - run: npm run build

      - name: Check every internal link resolves
        working-directory: .
        run: python3 .github/scripts/check_links.py docs/dist --base /ytkew

      - name: Check Pages is enabled
        # configure-pages reports a bare "Not Found" for this, which reads
        # like a broken workflow rather than a setting nobody has flipped.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "::error::Settings -> Pages -> Source -> \"GitHub Actions\", then re-run."
            exit 1
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - id: deploy
        uses: actions/deploy-pages@v5
