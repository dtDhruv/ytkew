name: pages

# Publishes docs/ to GitHub Pages. The site is plain HTML and CSS with no
# build step, so this only validates and uploads the directory.
#
# ONE-TIME SETUP: repository Settings -> Pages -> Source -> "GitHub Actions".
# Until that is done every run fails at configure-pages with a 404, because
# the repository has no Pages site to configure. The action can create one
# itself via its `enablement` input, but that needs a personal access token
# with admin scope rather than the built-in GITHUB_TOKEN, which is more
# trouble than the setting is.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # So the site can be published without an unrelated commit -- which is how
  # you publish it the first time, right after enabling Pages.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one part-way: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the pages are well-formed
        run: python3 .github/scripts/check_docs.py

      - name: Check Pages is enabled
        # configure-pages reports a bare "Not Found" for this, which reads
        # like a broken workflow rather than a setting nobody has flipped.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "::error::Settings -> Pages -> Source -> \"GitHub Actions\", then re-run this workflow."
            exit 1
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
